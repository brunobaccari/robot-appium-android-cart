name: Android tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Verificar arquivos versionados
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          test -z "$tracked" || { printf '%s\n' "$tracked"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/summary.py --self-test
      - run: cp .env.example .env
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Instalar driver e baixar app oficial
        run: |
          npx appium driver install --source=npm appium-uiautomator2-driver@8.7.0
          python - <<'PY'
          from dotenv import load_dotenv
          from pathlib import Path
          import os, urllib.request
          load_dotenv('.env')
          target = Path(os.environ['APP_PATH'])
          target.parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(os.environ['APP_URL'], target)
          PY
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: tests
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p results
            npx appium --address 127.0.0.1 --log-level warn > results/appium.log 2>&1 &
            for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4723/status && break; sleep 1; done
            curl -fsS http://127.0.0.1:4723/status
            python run_tests.py --outputdir results --xunit junit.xml src/Appium/Clients
      - name: Resumo dos testes
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EXPECTED_TESTS: '5'
          JUNIT_PATTERN: 'results/**/junit*.xml'
          TEST_SCOPE: Android 34 / My Demo App 2.3.0 / Robot Framework + Appium. Sem iOS ou pagamento real.
        run: python scripts/summary.py
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: android-results
          path: results/
          retention-days: 14
          if-no-files-found: error
      - name: Link dos resultados
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Baixar resultados](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
